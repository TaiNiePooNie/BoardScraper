name: Scheduled scrape

# Nightly start: Vercel Cron calls /api/cron/scrape at ~01:17 UTC (vercel.json), which
# dispatches this workflow. GitHub's own schedule (often hours late) is only a backup:
# it skips itself when a run was already started in the last 20 hours.
on:
  schedule:
    - cron: "17 5 * * *" # backup, daily 05:17 UTC
  workflow_dispatch:
    inputs:
      retailer:
        description: "Retailer id (blank = all)"
        required: false
      limit:
        description: "Max products per sport per retailer (blank = no limit)"
        required: false
      sport:
        description: "Sports, comma-separated: snow,skate,surf (blank = all)"
        required: false

permissions:
  contents: read
  actions: read # the backup schedule checks for today's run

concurrency:
  group: scrape
  cancel-in-progress: false

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          skip=false
          if [ "$EVENT" = "schedule" ]; then
            since=$(date -u -d '20 hours ago' +%Y-%m-%dT%H:%M:%SZ)
            n=$(gh api "repos/${{ github.repository }}/actions/workflows/scrape.yml/runs?event=workflow_dispatch&created=>=$since" --jq '.total_count')
            if [ "${n:-0}" -gt 0 ]; then skip=true; echo "A run was already started since $since (Vercel or manual): skipping the backup schedule."; fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  migrate:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      retailers: ${{ steps.list.outputs.retailers }}
    steps:
      - name: Require DATABASE_URL secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add a DATABASE_URL repository secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
        env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1" }
      - run: npm run db:migrate
      - id: list
        env:
          RETAILER: ${{ inputs.retailer }}
        run: echo "retailers=$(npm run -s retailers -- "$RETAILER")" >> "$GITHUB_OUTPUT"

  scrape:
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 300 # big sitemap shops (SkateHut, Zumiez…) fetch thousands of pages at >= 2.5 s each
    strategy:
      fail-fast: false
      # One job per retailer (each host has its own politeness delay, so jobs don't
      # compete); cap parallelism so dozens of retailers don't exhaust runner minutes
      # or hit the database with many concurrent writers.
      max-parallel: 8
      matrix:
        retailer: ${{ fromJSON(needs.migrate.outputs.retailers) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
        env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1" }
      - name: Scrape ${{ matrix.retailer }}
        env:
          SCRAPER_MIN_DELAY_MS: "2500"
          RETAILER: ${{ matrix.retailer }}
          LIMIT: ${{ inputs.limit }}
          SPORT: ${{ inputs.sport }}
        run: npm run scrape -- --retailer="$RETAILER" ${LIMIT:+--limit="$LIMIT"} ${SPORT:+--sport="$SPORT"}

  report:
    needs: [migrate, scrape]
    if: always() && needs.migrate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
        env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1" }
      - name: Read board colours from product photos (new boards only)
        run: npm run -s colors | tee -a "$GITHUB_STEP_SUMMARY"
        continue-on-error: true
      - run: npm run -s db:stats | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Send deal alert emails
        # Skips quietly until RESEND_API_KEY / EMAIL_FROM are set.
        run: npm run -s alerts | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          APP_URL: ${{ secrets.APP_URL }}
