name: Scheduled scrape

on:
  schedule:
    - cron: "17 4 * * *" # daily 04:17 UTC
  workflow_dispatch:
    inputs:
      retailer:
        description: "Retailer id (blank = all)"
        required: false
      limit:
        description: "Max products per retailer (blank = no limit)"
        required: false

permissions:
  contents: read

concurrency:
  group: scrape
  cancel-in-progress: false

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      retailers: ${{ steps.list.outputs.retailers }}
    steps:
      - name: Require DATABASE_URL secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add a DATABASE_URL repository secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
        env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1" }
      - run: npm run db:migrate
      - id: list
        env:
          RETAILER: ${{ inputs.retailer }}
        run: echo "retailers=$(npm run -s retailers -- "$RETAILER")" >> "$GITHUB_OUTPUT"

  scrape:
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        retailer: ${{ fromJSON(needs.migrate.outputs.retailers) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
        env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1" }
      - name: Scrape ${{ matrix.retailer }}
        env:
          SCRAPER_MIN_DELAY_MS: "2500"
          RETAILER: ${{ matrix.retailer }}
          LIMIT: ${{ inputs.limit }}
        run: npm run scrape -- --retailer="$RETAILER" ${LIMIT:+--limit="$LIMIT"}

  report:
    needs: [migrate, scrape]
    if: always() && needs.migrate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
        env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1" }
      - run: npm run -s db:stats | tee -a "$GITHUB_STEP_SUMMARY"
