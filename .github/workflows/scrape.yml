name: Scheduled scrape

# Daily price check at 01:17 UTC of all shops (the repo is public, so Actions minutes are free).
# Slow shops (one page per product) get max 150 min each and re-check known boards stalest-first.
# Vercel Cron starts it at a fixed time (vercel.json → /api/cron/scrape).
# GitHub's own schedule (often hours late) is only a backup and skips itself when a
# run was already started in the last 20 hours.
# Everything runs in ONE job: all shops of the group side by side, each at its own
# polite pace, so the waiting between requests is billed once, not once per shop.
on:
  schedule:
    - cron: "17 5 * * *" # backup
  workflow_dispatch:
    inputs:
      group:
        description: "Shops: fast (catalogue feeds), slow (page by page) or all"
        required: false
        default: all
        type: choice
        options: [fast, slow, all]
      retailer:
        description: "Retailer ids, comma-separated (blank = whole group)"
        required: false
      limit:
        description: "Max products per sport per retailer (blank = no limit)"
        required: false
      sport:
        description: "Sports, comma-separated: snow,skate,surf (blank = all)"
        required: false

permissions:
  contents: read
  actions: read # the backup schedule checks for a run Vercel already started

concurrency:
  group: scrape
  cancel-in-progress: false

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_GROUP: ${{ inputs.group }}
        run: |
          group="${INPUT_GROUP:-all}"
          skip=false
          if [ "$EVENT" = "schedule" ]; then
            since=$(date -u -d '20 hours ago' +%Y-%m-%dT%H:%M:%SZ)
            n=$(gh api "repos/${{ github.repository }}/actions/workflows/scrape.yml/runs?event=workflow_dispatch&created=>=$since" --jq '.total_count')
            if [ "${n:-0}" -gt 0 ]; then skip=true; echo "A run was already started since $since (Vercel or manual): skipping the backup schedule."; fi
          fi
          if [ "$skip" = false ] && [ -z "$DATABASE_URL" ]; then
            echo "::error::Add a DATABASE_URL repository secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          echo "group=$group" >> "$GITHUB_OUTPUT"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "Group: $group" >> "$GITHUB_STEP_SUMMARY"
      - if: steps.plan.outputs.skip != 'true'
        uses: actions/checkout@v5
      - if: steps.plan.outputs.skip != 'true'
        uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - if: steps.plan.outputs.skip != 'true'
        run: npm ci
        env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1" }
      - if: steps.plan.outputs.skip != 'true'
        run: npm run db:migrate
      - name: Scrape ${{ steps.plan.outputs.group }} shops
        if: steps.plan.outputs.skip != 'true'
        env:
          SCRAPER_MIN_DELAY_MS: "2500"
          INGEST_CONCURRENCY: "24" # shared by all shops of the run
          DB_POOL_MAX: "28"
          GROUP: ${{ steps.plan.outputs.group }}
          RETAILER: ${{ inputs.retailer }}
          LIMIT: ${{ inputs.limit }}
          SPORT: ${{ inputs.sport }}
        run: npm run scrape -- --group="$GROUP" --parallel --budget-minutes=150 ${RETAILER:+--retailer="$RETAILER"} ${LIMIT:+--limit="$LIMIT"} ${SPORT:+--sport="$SPORT"}
      - name: Read board colours from product photos (new boards only)
        if: always() && steps.plan.outputs.skip != 'true'
        run: npm run -s colors | tee -a "$GITHUB_STEP_SUMMARY"
        continue-on-error: true
      - if: always() && steps.plan.outputs.skip != 'true'
        run: npm run -s db:stats | tee -a "$GITHUB_STEP_SUMMARY"
        continue-on-error: true
      - name: Send deal alert emails
        if: always() && steps.plan.outputs.skip != 'true'
        # Skips quietly until RESEND_API_KEY / EMAIL_FROM are set.
        run: npm run -s alerts | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          APP_URL: ${{ secrets.APP_URL }}
